# Render Blueprint — deploys the FastAPI server.
# Dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are prompted for in the Render UI (never commit them).
#
# Postgres lives on Supabase (paste its *Session pooler* URI as DATABASE_URL).
# The Next.js client is deployed separately on Vercel (see README → Deploy).
services:
  - type: web
    name: financeai-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    # Apply migrations on every deploy, then serve.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"          # schema is owned by Alembic in production
      - key: DATABASE_URL
        sync: false             # Supabase → Connect → Session pooler URI (port 5432)
      - key: JWT_SECRET
        generateValue: true     # Render generates a strong random secret
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: CORS_ORIGINS
        sync: false             # e.g. https://financeai-pro.vercel.app
